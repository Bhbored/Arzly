name: Backend CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Arzly.slnx

      - name: Build
        run: dotnet build Arzly.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Arzly.slnx --configuration Release --no-build --logger "console;verbosity=normal"
